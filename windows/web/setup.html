<main><h1>台架机器人 · 本机配置</h1><p>复用已有飞书应用，连接本机 CC Connect 与 Codex。此页面只在你的电脑上提供。</p><aside>__STATUS__<br>当前阶段只调试连接，不会自动刷包或回放。</aside>
