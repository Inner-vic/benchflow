<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">回灌事务与故障恢复边界</title><desc id="desc">锁内进行候选激活、批量回灌和正式服务恢复核验，随后收集产品并发布评测。恢复失败保留台架锁，下游失败保留工作站产品。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#0a101e"/></linearGradient>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#71c7ff"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6be2b6"/></marker>
<marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c5afff"/></marker></defs>
<rect width="1200" height="360" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<text x="38" y="50" font-size="27" fill="#edf3ff" font-weight="700" >一次回灌，分阶段验证与交付</text>
<text x="38" y="80" font-size="12" fill="#a5b6cd" font-weight="400" >TRANSACTION → VERIFIED PRODUCT → INDEPENDENT ATTEMPT</text>
<rect x="221" y="99" width="526" height="123" rx="14" fill="#172b3a" stroke="#71c7ff"/>
<text x="242" y="125" font-size="16" fill="#71c7ff" font-weight="400" >独占台架锁 · 恢复或正式激活核验后才释放</text>
<rect x="35" y="148" width="156" height="52" rx="8" fill="#151f31" stroke="#34445f"/>
<text x="113.0" y="181" font-size="17" fill="#edf3ff" font-weight="400" text-anchor="middle">冻结输入 / 预检</text>
<text x="218.0" y="181" font-size="22" fill="#71c7ff" font-weight="400" text-anchor="middle">→</text>
<rect x="245" y="148" width="135" height="52" rx="8" fill="#151f31" stroke="#34445f"/>
<text x="312.5" y="181" font-size="17" fill="#edf3ff" font-weight="400" text-anchor="middle">候选激活</text>
<text x="395.0" y="181" font-size="22" fill="#71c7ff" font-weight="400" text-anchor="middle">→</text>
<rect x="410" y="148" width="135" height="52" rx="8" fill="#151f31" stroke="#34445f"/>
<text x="477.5" y="181" font-size="17" fill="#edf3ff" font-weight="400" text-anchor="middle">批量回灌</text>
<text x="560.0" y="181" font-size="22" fill="#71c7ff" font-weight="400" text-anchor="middle">→</text>
<rect x="575" y="148" width="147" height="52" rx="8" fill="#151f31" stroke="#34445f"/>
<text x="648.5" y="181" font-size="17" fill="#edf3ff" font-weight="400" text-anchor="middle">服务恢复核验</text>
<text x="753.0" y="181" font-size="22" fill="#71c7ff" font-weight="400" text-anchor="middle">→</text>
<rect x="784" y="148" width="160" height="52" rx="8" fill="#151f31" stroke="#34445f"/>
<text x="864.0" y="181" font-size="17" fill="#edf3ff" font-weight="400" text-anchor="middle">收集 / 校验产品</text>
<text x="968.0" y="181" font-size="22" fill="#71c7ff" font-weight="400" text-anchor="middle">→</text>
<rect x="992" y="148" width="174" height="52" rx="8" fill="#151f31" stroke="#34445f"/>
<text x="1079.0" y="181" font-size="17" fill="#edf3ff" font-weight="400" text-anchor="middle">发布 / 评测报告</text>
<text x="38" y="269" font-size="15" fill="#71c7ff" font-weight="600" >设备边界</text>
<text x="140" y="269" font-size="17" fill="#a5b6cd" font-weight="400" >台架事务失败保留证据；恢复核验失败保留锁，由负责人处理。</text>
<text x="38" y="303" font-size="15" fill="#6be2b6" font-weight="600" >产品边界</text>
<text x="140" y="303" font-size="17" fill="#a5b6cd" font-weight="400" >下游交付或评测失败保留权威产品，从对应阶段继续处理。</text>
<text x="38" y="337" font-size="14" fill="#a5b6cd" font-weight="400" >工程一致性与算法精度分别验收；算法结论仍依赖匹配真值与有效样本。</text>
</g></svg>
