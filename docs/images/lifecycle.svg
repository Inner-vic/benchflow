<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc">
<title id="title">BenchFlow · 当前事务与恢复边界</title><desc id="desc">准备在锁外，小场景和全量独立；后处理失败不导致重放，未知硬件结果保留屏障。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#74c7fa"/></marker></defs>
<rect width="1440" height="570" rx="20" fill="#0d1729"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="55" font-size="29" font-weight="700" fill="#f3f7ff">BenchFlow · 当前事务与恢复边界</text><rect x="40" y="110" width="300" height="255" rx="16" fill="#16263c" stroke="#74c7fa"/><text x="62" y="148" fill="#74c7fa" font-size="23" font-weight="700">锁外准备</text><text x="62" y="188" fill="#d4e2f3" font-size="18">材料版本确认</text><text x="62" y="220" fill="#d4e2f3" font-size="18">软件 / YAML / 数据</text><text x="62" y="252" fill="#d4e2f3" font-size="18">冻结候选与入口 FIFO</text><rect x="390" y="110" width="300" height="255" rx="16" fill="#16263c" stroke="#74c7fa"/><text x="412" y="148" fill="#74c7fa" font-size="23" font-weight="700">本次预检事务</text><text x="412" y="188" fill="#d4e2f3" font-size="18">按需部署 → 首选场景</text><text x="412" y="220" fill="#d4e2f3" font-size="18">回灌 → 恢复 → 产品核验</text><text x="412" y="252" fill="#d4e2f3" font-size="18">失败：诊断，不进全量</text><rect x="740" y="110" width="300" height="255" rx="16" fill="#16263c" stroke="#74c7fa"/><text x="762" y="148" fill="#74c7fa" font-size="23" font-weight="700">完整回灌事务</text><text x="762" y="188" fill="#d4e2f3" font-size="18">选定范围含预检场景</text><text x="762" y="220" fill="#d4e2f3" font-size="18">回灌 → 恢复 → 结果目录</text><text x="762" y="252" fill="#d4e2f3" font-size="18">未知：保留锁 / 待核验</text><rect x="1090" y="110" width="310" height="255" rx="16" fill="#16263c" stroke="#79dec1"/><text x="1112" y="148" fill="#79dec1" font-size="23" font-weight="700">独立交付与后处理</text><text x="1112" y="188" fill="#d4e2f3" font-size="18">交付目录，释放硬件队列</text><text x="1112" y="220" fill="#d4e2f3" font-size="18">普通评测 → 原始 TXT</text><text x="1112" y="252" fill="#d4e2f3" font-size="18">原卡到点按钮 → XLSX</text><path d="M340 230L382 230" fill="none" stroke="#74c7fa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 230L732 230" fill="none" stroke="#74c7fa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1040 230L1082 230" fill="none" stroke="#74c7fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="430" font-size="23" fill="#79dec1">只有本次预检 PASS 且冻结身份一致，才进入全量；成功回灌不因后处理失败重做。</text><text x="40" y="478" font-size="20" fill="#cbdaf1">入口 FIFO 确定用户任务顺序，Runner JSON 锁协调安装、回灌、清理等共享硬件操作。</text><text x="40" y="522" font-size="20" fill="#cbdaf1">未知执行结果只核验原 run / attempt；连接恢复或进程重启都不能替代恢复收据。</text></g></svg>