e7c" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#green)"/><text x="640.0" y="620" font-size="19" fill="#268e7c" font-weight="400" text-anchor="middle">结果目录与收据</text><path d="M460 707H1430" fill="none" stroke="#3274cf" stroke-width="2.3" marker-end="url(#blue)"/><text x="945.0" y="697" font-size="19" fill="#3274cf" font-weight="400" text-anchor="middle">签名派发 / 本任务 GT 关联</text><path d="M1430 751H460" fill="none" stroke="#268e7c" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#green)"/><text x="945.0" y="741" font-size="19" fill="#268e7c" font-weight="400" text-anchor="middle">原始 TXT / 覆盖检查</text><path d="M460 793H160" fill="none" stroke="#268e7c" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#green)"/><text x="310.0" y="783" font-size="19" fill="#268e7c" font-weight="400" text-anchor="middle">原卡交付结果</text><path d="M72 830H1528" stroke="#dce4ef"/><text x="72" y="864" font-size="19" fill="#61718b" font-weight="400" text-anchor="start">预检与全量分别恢复；全量包含预检场景。</text><text x="1528" y="864" font-size="19" fill="#61718b" font-weight="400" text-anchor="end">到点精度：交付后由原卡按钮另行触发。</text></g></svg>