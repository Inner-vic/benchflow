<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">回灌事务与故障恢复边界</title><desc id="desc">输入冻结后在台架锁内执行激活、回灌和服务恢复，随后收集、上传、评测。下游故障使用已有产品处理。</desc><rect width="1200" height="350" rx="20" fill="#f1f5f9"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="38" y="49" font-size="25" font-weight="700" fill="#0f172a">一次回灌，分阶段验证与交付</text><rect x="222" y="83" width="524" height="130" rx="16" fill="#dbeafe" stroke="#60a5fa"/><text x="243" y="110" font-size="16" fill="#1d4ed8">台架锁：只有恢复或正式激活核验后才释放</text><g fill="#fff" stroke="#94a3b8"><rect x="35" y="132" width="156" height="55" rx="9"/><rect x="245" y="132" width="135" height="55" rx="9"/><rect x="410" y="132" width="135" height="55" rx="9"/><rect x="575" y="132" width="147" height="55" rx="9"/><rect x="784" y="132" width="160" height="55" rx="9"/><rect x="992" y="132" width="174" height="55" rx="9"/></g><g fill="#0f172a" font-size="18" text-anchor="middle"><text x="113" y="167">冻结输入 / 预检</text><text x="312" y="167">候选激活</text><text x="477" y="167">批量回灌</text><text x="648" y="167">服务恢复核验</text><text x="864" y="167">收集 / 校验产品</text><text x="1079" y="167">上传 / 评测报告</text></g><g fill="#2563eb" font-size="26"><text x="202" y="168">→</text><text x="383" y="168">→</text><text x="548" y="168">→</text><text x="751" y="168">→</text><text x="954" y="168">→</text></g><text x="40" y="261" fill="#334155" font-size="18">台架事务失败 → 保留证据；恢复失败 → 保留锁并交由负责人处理。</text><text x="40" y="295" fill="#334155" font-size="18">交付或评测失败 → 保留工作站产品，从对应阶段处理，避免重复回灌。</text><text x="40" y="325" fill="#64748b" font-size="15">产品身份验证证明工程交付一致；算法精度仍需匹配真值与有效样本评测。</text></g></svg>
