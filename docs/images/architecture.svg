<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">BenchFlow · 当前统一入口与执行分层</title><desc id="desc">飞书材料卡经个人电脑网关进入工作站Runner；小场景和全量分别恢复，普通评测与到点分析独立运行。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#74c7fa"/></marker></defs>
<rect width="1440" height="650" rx="20" fill="#0d1729"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="55" font-size="29" font-weight="700" fill="#f3f7ff">BenchFlow · 当前统一入口与执行分层</text><rect x="40" y="100" width="310" height="310" rx="16" fill="#16263c" stroke="#74c7fa"/><text x="62" y="138" fill="#74c7fa" font-size="23" font-weight="700">飞书统一入口</text><text x="62" y="178" fill="#d4e2f3" font-size="18">本人材料与同一任务卡</text><text x="62" y="210" fill="#d4e2f3" font-size="18">APP / SO / YAML / 数据</text><text x="62" y="242" fill="#d4e2f3" font-size="18">明确确认当前材料版本</text><text x="62" y="274" fill="#d4e2f3" font-size="18">目标 / 范围 / 回放方式</text><rect x="390" y="100" width="310" height="310" rx="16" fill="#16263c" stroke="#74c7fa"/><text x="412" y="138" fill="#74c7fa" font-size="23" font-weight="700">个人电脑网关</text><text x="412" y="178" fill="#d4e2f3" font-size="18">CC Connect + Codex</text><text x="412" y="210" fill="#d4e2f3" font-size="18">锁外准备与冻结候选</text><text x="412" y="242" fill="#d4e2f3" font-size="18">持久 FIFO / 单调度器</text><text x="412" y="274" fill="#d4e2f3" font-size="18">独立评测与报告状态</text><rect x="740" y="100" width="310" height="310" rx="16" fill="#16263c" stroke="#74c7fa"/><text x="762" y="138" fill="#74c7fa" font-size="23" font-weight="700">工作站与台架</text><text x="762" y="178" fill="#d4e2f3" font-size="18">既有 Runner + JSON 锁</text><text x="762" y="210" fill="#d4e2f3" font-size="18">按需部署本次软件</text><text x="762" y="242" fill="#d4e2f3" font-size="18">本次小场景 → 全量</text><text x="762" y="274" fill="#d4e2f3" font-size="18">分别恢复、核验和留存</text><rect x="1090" y="100" width="310" height="310" rx="16" fill="#16263c" stroke="#79dec1"/><text x="1112" y="138" fill="#79dec1" font-size="23" font-weight="700">产品与后处理</text><text x="1112" y="178" fill="#d4e2f3" font-size="18">工作站预测产品与目录</text><text x="1112" y="210" fill="#d4e2f3" font-size="18">普通评测：独立队列</text><text x="1112" y="242" fill="#d4e2f3" font-size="18">任务关联 GT → 原始 TXT</text><text x="1112" y="274" fill="#d4e2f3" font-size="18">到点按钮 → XLSX / 计划</text><path d="M350 253L384 253" fill="none" stroke="#74c7fa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 253L734 253" fill="none" stroke="#74c7fa" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1050 253L1084 253" fill="none" stroke="#74c7fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="462" font-size="23" fill="#79dec1">保留：确定性事务、服务恢复、预测产品身份与跨入口硬件互斥</text><text x="40" y="506" font-size="21" fill="#cbdaf1">改变：卡片确认 / 本次预检 / 云端原始输入直传 / 独立评测 / 任务 GT / 到点原卡按钮</text><text x="40" y="556" font-size="19" fill="#a9bbd3">预检与全量是两个 Runner 事务；评测与到点后处理不占台架锁。</text><text x="40" y="592" font-size="19" fill="#a9bbd3">源码归档与历史验证不等于当前服务就绪，也不证明 PCM 或逐帧实机已验收。</text></g></svg>