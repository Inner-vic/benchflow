<title id="title">BenchFlow · 个人电脑接入与工作站业务集中</title><desc id="desc">当前接入架构，连接器迁回已验证：个人电脑运行CC Connect与Codex，飞书长连接在个人电脑；工作站保留业务网关、数据库、文件与执行。LPAI原始数据直接到工作站、GT留云端；工作站可以经飞书API交付卡片和报告。本轮只切换连接器，未执行台架任务。</desc>
